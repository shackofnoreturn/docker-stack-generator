[project]
name = "docker-stack-generator"
version = "1.3.0"
description = "GUI tool to scaffold Docker Swarm stack files"
requires-python = ">=3.11"
dependencies = [
    "PyQt6",
    "requests",
    "PyYAML",
    "Jinja2",
]

[project.scripts]
docker-stack-generator = "docker_stack_generator.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
